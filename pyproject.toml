[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neoantigen-utils"
version = "1.5.0"
description = "Helper scripts for the MSK neoantigen pipeline: mutated/alt-transcript peptide FASTA generation and neoantigen input construction."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "John Orgera" },
]
keywords = ["neoantigen", "fasta", "netmhc", "mutation", "hgvsc", "nmd", "mutalyzer", "genome-nexus"]
dependencies = [
    "pandas",
    "numpy",
    # Bio.pairwise2 (used in generate_input) is deprecated and slated for removal;
    # pin an upper bound until migrated to Bio.Align.PairwiseAligner.
    "biopython<1.90",
]

# pyensembl (for generate_input's transcript/NMD logic) and mutalyzer (for
# generate_mut_fasta's HGVS normalization) are heavy, container-provided runtime
# deps. They are imported tolerantly / stubbed in tests, so they are optional.
[project.optional-dependencies]
pyensembl = ["pyensembl"]
mutalyzer = ["mutalyzer"]
dev = ["pytest"]

# Preserve the exact commands the container/modules invoke.
[project.scripts]
"generateMutFasta.py" = "neoantigen_utils.generate_mut_fasta:main"
"generate_input.py" = "neoantigen_utils.generate_input:console"
"convertannotjson.py" = "neoantigen_utils.convertannotjson:main"
"format_netmhcpan_output.py" = "neoantigen_utils.format_netmhcpan_output:console"
"generateHLAString.sh" = "neoantigen_utils.hla_string:console"
"annotate_rna.py" = "neoantigen_utils.annotate_rna:main"
"prepare_fusion_fasta.py" = "neoantigen_utils.prepare_fusion_fasta:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neoantigen_utils"]
# Ship the bundled shell script (data files inside the package are included).
artifacts = ["src/neoantigen_utils/data/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
