[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generatemutfasta"
version = "1.3.0"
description = "Construct mutated (and alternate-transcript) peptide FASTAs from a MAF for neoantigen prediction."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "John Orgera" },
]
keywords = ["neoantigen", "fasta", "netmhc", "mutation", "hgvsc", "mutalyzer", "genome-nexus"]
dependencies = [
    "pandas",
]

# mutalyzer is the runtime dependency used for HGVS normalization. It is
# provided by the execution container and is imported tolerantly, so it is an
# optional extra here (unit tests do not require it).
[project.optional-dependencies]
mutalyzer = ["mutalyzer"]
dev = ["pytest"]

# Preserve the exact command the container/module invokes: ``generateMutFasta.py``.
[project.scripts]
"generateMutFasta.py" = "generatemutfasta.generate_mut_fasta:main"

[tool.hatch.build.targets.wheel]
packages = ["src/generatemutfasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
